<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wasit Tujuhbelasan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Sniglet:wght@400;800&display=swap">
<style>
/* Layout: lapangan kampung ilustrasi di kiri (dunia permainan), papan cerita di kanan; di HP lapangan jadi strip lengket di atas (tinggi diatur lewat --map-h-mobile), papan di bawah. Satu tema terang yang disengaja. */
:root{
  --map-h-mobile:160px;          /* tinggi peta di smartphone (lebar selalu 100%) */
  --grass:#8CC63F; --grass-deep:#76B234; --ink:#2B2117; --paper:#FFFFFF; --paper-2:#FFF4E2;
  --sand:#F3D27E; --orange:#F28C28; --orange-deep:#B85A0C; --sky:#2F8FC4; --red:#D93A2F; --blue:#2F7FC1; --leaf:#3E9E3A;
  --muted:#6B5D4C; --screen:#1F2B33; --screen-2:#2C3B45; --screen-fg:#EAF2F5; --screen-dim:#9FB6C1;
  --chat-bg:#EFE6D6; --chat-head:#1F6F5C; --bubble-me:#DDF5C8; --merah:#FBE0DC; --biru:#D6EAF8;
  --ok:#DDF1D3; --no:#FBE0D9; --disabled:#D8D0C4; --disabled-fg:#7A6F61;
  --font-display:'Sniglet','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Mali','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%}
body{height:100%;background:var(--grass);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 430px}
.map-shell{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--grass)}
#map{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none}
#map.panning{cursor:grabbing}
#map text{font-family:var(--font-display);font-weight:800}
.brand{position:absolute;top:14px;left:max(16px,env(safe-area-inset-left,0px));z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.brand-name,.brand-sub{color:#fff;font-family:var(--font-display);font-weight:800;line-height:1;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
.brand-name{font-size:30px;letter-spacing:.03em}
.brand-sub{font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-shadow:1.5px 0 0 var(--ink),-1.5px 0 0 var(--ink),0 1.5px 0 var(--ink),0 -1.5px 0 var(--ink),0 2.5px 0 var(--ink)}
.map-toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;background:var(--paper);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);padding:6px 16px;font-family:var(--font-display);font-weight:800;font-size:15px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.ctrl{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));z-index:4;display:flex;gap:8px}
.ctrl button,.zoom button{width:40px;height:40px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.ctrl button:active,.zoom button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ctrl button:focus-visible,.zoom button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ctrl button .slash{display:none}
.ctrl button[aria-pressed="false"]{background:var(--disabled)}
.ctrl button[aria-pressed="false"] .slash{display:inline}
.ctrl .mob{display:none}
.zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:14px;z-index:4;display:flex;flex-direction:column;gap:6px}
.zoom button:disabled{opacity:.45;cursor:default;box-shadow:0 3px 0 var(--ink)}

.panel{min-width:0;overflow-y:auto;background:var(--grass-deep);border-left:4px solid var(--ink);display:flex;flex-direction:column;gap:14px;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;counter-reset:s}
.steps li{counter-increment:s;font-family:var(--font-display);font-weight:800;font-size:12.5px;padding:3px 10px 3px 4px;border-radius:999px;background:rgba(255,255,255,.4);border:2px solid transparent;display:flex;align-items:center;gap:5px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.7);font-size:11px}
.steps li.done{background:var(--paper)}
.steps li.done::before{content:"✓";background:var(--leaf);color:#fff}
.steps li.now{background:var(--orange);border-color:var(--ink)}
.steps li.now::before{background:var(--paper)}

.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.buzz{animation:buzz .38s ease-in-out}
@keyframes buzz{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.eyebrow{font-family:var(--font-display);font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-deep);margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:29px}
h2{font-size:21px}
h3{font-size:15px}
h1:focus,h2:focus{outline:none}
p{margin:0}
.small{font-size:13.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.meter{font-family:var(--font-display);font-weight:800;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1.2;background:var(--orange);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px 18px;cursor:pointer;transition:transform .08s,box-shadow .08s;min-height:44px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:var(--disabled);color:var(--disabled-fg);border-color:var(--disabled-fg);box-shadow:0 4px 0 var(--disabled-fg);cursor:not-allowed;filter:none}
.btn.ghost{background:var(--paper)}
.btn.red{background:var(--red);color:#fff}
.btn.small-btn{font-size:18px;padding:4px 14px}
.btn:focus-visible,.opt input:focus-visible+span,.chip input:focus-visible+span,textarea:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--sky);outline-offset:3px}

.found{display:grid;gap:8px}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;border:2.5px solid var(--ink);border-radius:14px;padding:10px;background:var(--paper)}
.item strong{font-family:var(--font-display);font-weight:800;font-size:15px}
.item.locked{border-style:dashed;background:transparent}
.ico{width:34px;height:34px;border-radius:50%;background:var(--orange);border:2.5px solid var(--ink);display:grid;place-items:center}
.item.done .ico{background:var(--leaf)}
.rules{display:grid;gap:6px;margin-top:6px}
.rules div{border:2px solid var(--ink);border-radius:10px;padding:6px 10px;background:var(--paper-2);font-size:14px}
.rules b{font-family:var(--font-display)}

.opts{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:flex;gap:10px;align-items:center;border:2.5px solid var(--ink);border-radius:14px;padding:9px 12px;background:var(--paper);font-weight:600;transition:background .15s;min-height:44px}
.opt span b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sand);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-size:13px}
.opt input:checked+span{background:var(--paper-2);border-color:var(--orange-deep);box-shadow:0 3px 0 var(--orange-deep)}
.opt input:checked+span b{background:var(--orange)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-block;cursor:pointer}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:7px 12px;background:var(--paper);font-weight:600;font-size:14px}
.chip input:checked+span{background:var(--sand);box-shadow:0 3px 0 var(--ink)}
.group{display:flex;flex-direction:column;gap:6px}
.glabel,label.field{font-family:var(--font-display);font-weight:800;font-size:14.5px}
textarea{width:100%;font:inherit;font-size:16px;border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;resize:vertical;background:var(--paper);color:var(--ink)}

.callout{background:var(--paper-2);border:2.5px dashed var(--orange-deep);border-radius:14px;padding:10px 12px;font-weight:600}
.quote{background:var(--paper-2);border:2.5px solid var(--ink);border-radius:14px;padding:10px 14px;font-style:italic;overflow-wrap:anywhere}
.quote.big{background:var(--ink);color:#fff;font-style:normal;font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1.3}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.impact>div{border:2.5px solid var(--ink);border-radius:14px;padding:10px;min-width:0;display:flex;flex-direction:column;gap:4px}
.impact .merah{background:var(--merah)}
.impact .biru{background:var(--biru)}
.view{border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#7FBF3F}
.view svg,.screen svg{display:block;width:100%;height:auto}
.view figcaption{background:var(--paper-2);border-top:3px solid var(--ink);padding:8px 12px;font-size:14px}
figure{margin:0}

.chat{background:var(--chat-bg);border:3px solid var(--ink);border-radius:16px;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chat-head);color:#fff;border-bottom:3px solid var(--ink)}
.chat-head strong{font-family:var(--font-display);font-weight:800;display:block;line-height:1.1}
.chat-head small{font-size:12px;opacity:.9}
.avatar{width:32px;height:32px;border-radius:50%;background:#9FCBEA;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:var(--ink)}
.chat-body{padding:12px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.bub{max-width:86%;padding:7px 11px;border-radius:14px;border:2px solid var(--ink);font-size:14.5px;background:var(--paper);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--bubble-me)}
.bub.new{animation:bubIn .28s ease-out}
@keyframes bubIn{from{transform:translateY(8px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.typing{display:flex;gap:4px;align-items:center;padding:10px 12px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}

.monitor{background:var(--screen);color:var(--screen-fg);border:3px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 6px var(--screen-2)}
.mon-top{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;letter-spacing:.05em;font-size:13px}
.rec{width:11px;height:11px;border-radius:50%;background:var(--red);flex:none;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tag{margin-left:auto;font-size:11px;border:1.5px solid var(--screen-fg);border-radius:6px;padding:1px 6px}
.screen{border:3px solid #0E1519;border-radius:10px;overflow:hidden}
.scrub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.scrub input{width:100%;accent-color:var(--orange);height:32px}
.cap{font-weight:600;min-height:44px}
.seen{font-family:var(--font-display);font-size:12px;color:var(--screen-dim);letter-spacing:.05em}
.mon-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.decide{display:flex;flex-direction:column;gap:12px}
.compare{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.compare>div{border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;min-width:0}
.compare small{display:block;font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.compare .arrow{font-family:var(--font-display);font-size:22px;border:0;padding:0}

.flow{display:grid;gap:6px}
.flow div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;font-family:var(--font-display);font-weight:800;font-size:13.5px;background:var(--sand)}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--leaf);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tick.no{background:var(--paper);color:var(--ink)}
.sort-card{border:3px solid var(--ink);border-radius:16px;padding:14px;background:var(--paper-2);font-weight:600;font-size:16px;display:flex;flex-direction:column;gap:4px}
.sort-card small{font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sort-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feedback{border-radius:12px;padding:10px 12px;border:2.5px solid var(--ink)}
.feedback.ok{background:var(--ok)}
.feedback.no{background:var(--no)}
.map-table{display:grid;gap:6px}
.map-table div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);gap:8px;align-items:center;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px}
.map-table span:first-child{font-family:var(--font-display);font-weight:800}
.summary{display:grid;gap:8px;margin:0}
.summary div{border-bottom:2px dotted var(--muted);padding-bottom:8px;min-width:0}
.summary dt{font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.summary dd{margin:0;overflow-wrap:anywhere}
.next{border:3px solid var(--ink);border-radius:16px;background:var(--screen);color:var(--screen-fg);padding:14px;display:flex;flex-direction:column;gap:4px}
.next small{font-family:var(--font-display);font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--screen-dim);font-size:11.5px}
.next strong{font-family:var(--font-display);font-size:18px}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- map: interaction ---------- */
.hotspot{cursor:pointer;outline:none}
.hotspot .bob{transition:transform .2s;transform-box:fill-box;transform-origin:center bottom}
.hotspot:hover .bob,.hotspot:focus-visible .bob{transform:translateY(-5px)}
.hotspot:focus-visible .sign{stroke:var(--sky);stroke-width:7}
.ring{fill:none;stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.75);opacity:0}}
.hotspot.seen .ring{display:none}
.hotspot.seen .sign{fill:var(--leaf)}
.hotspot .chk{display:none}
.hotspot.seen .chk{display:inline}
.pop{animation:popin .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center bottom}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
.glow{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{fill:#5FD4E8}}
.waves path{animation:toawave 1.2s ease-out infinite;opacity:0}
.waves path:nth-child(2){animation-delay:.25s}.waves path:nth-child(3){animation-delay:.5s}
@keyframes toawave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#dusk{transition:opacity 1.6s ease}

/* ---------- map: ambient life ---------- */
.flap{transform-box:fill-box;transform-origin:50% 0;animation:flap var(--d,2s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes flap{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.wave{transform-box:fill-box;transform-origin:0 50%;animation:flagwave var(--d,1.2s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes flagwave{from{transform:scaleX(1) skewY(0)}to{transform:scaleX(.8) skewY(-9deg)}}
.tree-sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway var(--d,9s) ease-in-out var(--dl,0s) infinite}
@keyframes sway{0%,66%,100%{transform:rotate(0)}72%{transform:rotate(1.8deg)}79%{transform:rotate(-1.2deg)}86%{transform:rotate(.8deg)}93%{transform:rotate(0)}}
#map.gust .tree-sway{animation:gustsway 1.6s ease-in-out}
#map.gust .flap{animation-duration:.4s}
#map.gust .wave{animation-duration:.35s}
@keyframes gustsway{0%{transform:rotate(0)}30%{transform:rotate(3.6deg)}55%{transform:rotate(-1.6deg)}78%{transform:rotate(1.2deg)}100%{transform:rotate(0)}}
.idle{transform-box:fill-box;transform-origin:50% 100%;animation:idle var(--d,2.4s) ease-in-out var(--dl,0s) infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.walk .idle{animation:walkbob .26s ease-in-out infinite alternate}
@keyframes walkbob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-4px) rotate(3deg)}}
.still .idle{animation:none}
.fan{transform-box:fill-box;transform-origin:50% 100%;animation:fanbob var(--d,1.8s) ease-in-out var(--dl,0s) infinite}
@keyframes fanbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.fan .arms{opacity:0;transition:opacity .2s}
.trib.excited .fan{animation:jump .4s ease-in-out var(--dl,0s) infinite alternate}
.trib.excited .arms{opacity:1}
.trib.angry .fan{animation:angry .26s linear var(--dl,0s) infinite}
.trib.tense .fan{animation:lean .9s ease-in-out var(--dl,0s) infinite alternate}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-9px)}}
@keyframes angry{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
@keyframes lean{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.wing{transform-box:fill-box;transform-origin:50% 100%;animation:wing .32s ease-in-out infinite alternate}
@keyframes wing{from{transform:scaleY(1)}to{transform:scaleY(.25)}}
/* tribune speech bubble: pulse + ring + shake */
.bp{transform-box:fill-box;transform-origin:50% 100%;animation:bpulse 1.3s ease-in-out .4s infinite}
.bp.shake{animation:bshake .55s ease-in-out .4s infinite}
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes bshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.bring{fill:none;stroke-width:4;transform-box:fill-box;transform-origin:50% 50%;animation:bring 1.3s ease-out .4s infinite}
@keyframes bring{from{transform:scale(1);opacity:.9}to{transform:scale(1.3,1.7);opacity:0}}

/* grass & flowers in the wind */
.grass{transform-box:fill-box;transform-origin:50% 100%;animation:grass var(--d,2s) ease-in-out var(--dl,0s) infinite alternate}
@keyframes grass{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
#map.gust .grass{animation:gustgrass 2s ease-in-out}
@keyframes gustgrass{0%{transform:rotate(0)}30%{transform:rotate(16deg)}55%{transform:rotate(-5deg)}78%{transform:rotate(6deg)}100%{transform:rotate(0)}}
/* crowd idle wave during swells, empty field */
.trib.ripple .fan{animation:jump .5s ease-in-out var(--dl,0s) infinite alternate}
.trib.ripple .fan:nth-child(3n) .arms{opacity:1}
.trib .fan{transition:opacity .8s ease}
.trib.empty .fan{opacity:0}
#L-people{transition:opacity .8s ease}
/* zone stamp in the middle of the field */
.zpulse{transform-box:fill-box;transform-origin:50% 50%}
.zpulse.red{animation:zpulse 1.2s ease-in-out .6s infinite}
@keyframes zpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.stamp{transform-box:fill-box;transform-origin:50% 50%;animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both}
.stamp.ask{animation:stampAsk .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes stampAsk{from{transform:translateY(-30px) scale(.6);opacity:0}to{transform:none;opacity:1}}

<script>
(function(){
'use strict';
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const store={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* =========================================================
   AUDIO: semua suara dibuat dengan Web Audio (tanpa file)
   ========================================================= */
const Snd=(function(){
  let ctx=null,master,bgmG,sfxG,ambG,noiseBuf,timer=null,nextT=0,step=0,mood='normal',crowdBase=.03;
  const on=Object.assign({music:true,sfx:true},store.get('w17-sound')||{});
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
    try{ctx=new AC();}catch(e){return;}
    master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
    bgmG=ctx.createGain();bgmG.gain.value=on.music?.16:0;bgmG.connect(master);
    sfxG=ctx.createGain();sfxG.gain.value=on.sfx?.6:0;sfxG.connect(master);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    // crowd murmur ambience
    const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=650;f.Q.value=.6;
    ambG=ctx.createGain();ambG.gain.value=0;s.connect(f);f.connect(ambG);ambG.connect(sfxG);s.start();crowdTo(crowdBase,3);
    nextT=ctx.currentTime+.15;timer=setInterval(schedule,60);
    document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();});
  }
  const ok=()=>ctx&&ctx.state==='running';
  function crowdTo(v,sec){if(!ctx)return;const g=ambG.gain,t=ctx.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(v,t+sec);}
  function env(g,t,a,peak,rel){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+rel);}
  function tone(type,f,t,dur,peak,dest,glide){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);env(g,t,.006,peak,dur);o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+dur+.08);}
  function noise(t,dur,type,freq,q,peak,dest,a,sweep){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ctx.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+(a||.01)+dur*.5);f.Q.value=q||1;const g=ctx.createGain();env(g,t,a||.01,peak,dur);s.connect(f);f.connect(g);g.connect(dest||sfxG);s.start(t,Math.random());s.stop(t+(a||.01)+dur+.1);}
  // --- BGM: riang ala panggung 17-an (marimba pentatonik + bas + shaker)
  const PROG=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
  const PENTA=[72,74,76,79,81,84];
  const MEL=[[0,null,2,null,4,2,null,1],[3,null,2,0,null,2,null,null],[4,null,5,4,2,null,1,null],[1,2,null,4,null,3,null,null],
             [0,null,2,null,4,5,null,4],[3,null,2,null,0,null,2,null],[1,null,2,4,null,2,1,null],[2,null,1,null,0,null,null,null]];
  function schedule(){if(!ctx)return;const stepLen=(60/104)/2*(mood==='calm'?1.3:1);while(nextT<ctx.currentTime+.25){playStep(step,nextT);nextT+=stepLen;step++;}}
  function playStep(s,t){
    if(!on.music)return;
    const bar=Math.floor(s/8)%4,e=s%8,ch=PROG[bar];
    if(mood==='tense'){
      if(e%2===0)tone('sine',mtof(ch[0]-12),t,.25,.2,bgmG);
      if(e%2===1)noise(t,.03,'highpass',7000,1,.05,bgmG);
      if(e===0)tone('triangle',mtof(ch[0]+13),t,1.3,.025,bgmG);
      return;
    }
    if(e===0||e===4)tone('sine',mtof(ch[0]-12),t,.4,.22,bgmG);
    if(e===6&&mood!=='calm')tone('sine',mtof(ch[2]-12),t,.2,.12,bgmG);
    if(mood!=='calm'&&e%2===1)noise(t,.04,'highpass',6500,1,.045,bgmG);
    const n=MEL[(s>>3)%MEL.length][e];
    if(n!=null){const f=mtof(PENTA[n]);tone('sine',f,t,.32,mood==='calm'?.08:.12,bgmG);tone('triangle',f*4,t,.05,.018,bgmG);}
    if(e===2||e===6)ch.forEach(m=>tone('triangle',mtof(m+12),t,.2,.028,bgmG));
  }
  const api={
    init,
    setMood(m){mood=m;},
    get music(){return on.music;},get sfx(){return on.sfx;},
    setMusic(v){on.music=v;store.set('w17-sound',on);if(ctx)bgmG.gain.setTargetAtTime(v?.16:0,ctx.currentTime,.1);},
    setSfx(v){on.sfx=v;store.set('w17-sound',on);if(ctx)sfxG.gain.setTargetAtTime(v?.6:0,ctx.currentTime,.05);},
    click(){if(!ok())return;tone('triangle',880,ctx.currentTime,.05,.12);},
    pop(){if(!ok())return;tone('sine',480,ctx.currentTime,.1,.22,null,1150);},
    tick(){if(!ok())return;tone('square',2100,ctx.currentTime,.018,.05);},
    thud(){if(!ok())return;tone('sine',130,ctx.currentTime,.3,.5,null,45);noise(ctx.currentTime,.12,'lowpass',400,1,.15);},
    gasp(){if(!ok())return;noise(ctx.currentTime+.05,.7,'bandpass',600,.8,.22,null,.25,1300);},
    whistle(seq){if(!ok())return;let t=ctx.currentTime;(seq||[.45]).forEach(len=>{
      const o=ctx.createOscillator(),l=ctx.createOscillator(),lg=ctx.createGain(),g=ctx.createGain();
      o.type='sine';o.frequency.value=2750;l.frequency.value=27;lg.gain.value=170;l.connect(lg);lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.setValueAtTime(.3,t+len-.05);g.gain.exponentialRampToValueAtTime(.0001,t+len);
      o.connect(g);g.connect(sfxG);o.start(t);l.start(t);o.stop(t+len+.05);l.stop(t+len+.05);
      noise(t,len*.9,'bandpass',2800,4,.05);t+=len+.14;});},
    cheer(v){if(!ok())return;const t=ctx.currentTime;v=v||1;noise(t,1.7,'bandpass',1100,.6,.32*v,null,.15);
      for(let i=0;i<5;i++)tone('triangle',500+Math.random()*300,t+.1+i*.12,.35,.025*v,null,800+Math.random()*400);
      if(crowdBase>0){const g=ambG.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(crowdBase+.06,t+.3);g.linearRampToValueAtTime(crowdBase,t+3.2);}},
    boo(v){if(!ok())return;const t=ctx.currentTime;v=v||1;noise(t,1.5,'lowpass',480,.7,.3*v,null,.2);tone('sawtooth',135,t+.05,1.3,.04*v,null,95);tone('sawtooth',142,t+.1,1.2,.03*v,null,100);},
    toa(){if(!ok())return;const t=ctx.currentTime;[[784,0],[622,.42]].forEach(([f,d])=>{tone('sine',f,t+d,.5,.22);tone('triangle',f*2,t+d,.3,.04);});noise(t,.15,'highpass',3000,1,.05);},
    chime(){if(!ok())return;const t=ctx.currentTime;[523,659,784].forEach((f,i)=>tone('triangle',f,t+i*.07,.32,.2));},
    buzz(){if(!ok())return;const t=ctx.currentTime;tone('square',190,t,.12,.07);tone('square',150,t+.13,.18,.07);},
    send(){if(!ok())return;noise(ctx.currentTime,.3,'bandpass',500,1.5,.12,null,.02,2600);},
    ding(){if(!ok())return;const t=ctx.currentTime;tone('sine',1318,t,.25,.16);tone('sine',1760,t+.09,.32,.14);},
    chirp(){if(!ok())return;const t=ctx.currentTime;for(let i=0;i<3;i++)tone('sine',3000+Math.random()*600,t+i*.11,.07,.05,null,4300);},
    gust(){if(!ok())return;const t=ctx.currentTime,s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;
      const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=.7;f.frequency.setValueAtTime(280,t);f.frequency.linearRampToValueAtTime(800,t+1.5);f.frequency.linearRampToValueAtTime(320,t+3.6);
      const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.016,t+1.5);g.gain.linearRampToValueAtTime(0,t+3.6);
      s.connect(f);f.connect(g);g.connect(sfxG);s.start(t,Math.random());s.stop(t+3.7);},
    kick(v){if(!ok())return;v=v||1;const t=ctx.currentTime;tone('sine',170,t,.12,.2*v,null,65);noise(t,.03,'bandpass',1300,1,.06*v);},
    setCrowd(v,sec){crowdBase=v;crowdTo(v,sec||1.5);},
    get crowdOn(){return crowdBase>0;},
    swell(){if(!ok()||crowdBase<=0)return;const t=ctx.currentTime,g=ambG.gain,pk=crowdBase+.045;
      g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(pk,t+2.2);g.linearRampToValueAtTime(pk,t+3.6);g.linearRampToValueAtTime(crowdBase,t+6.5);
      for(let i=0;i<16;i++)noise(t+1+Math.random()*3.4,.025,'highpass',1800,1,.02+Math.random()*.02);
      for(let i=0;i<3;i++)tone('triangle',380+Math.random()*200,t+1.5+Math.random()*2,.5,.008,null,520+Math.random()*200);},
    stamp(kind){if(!ok())return;const t=ctx.currentTime;tone('sine',110,t,.35,.45,null,45);noise(t,.08,'lowpass',600,1,.15);
      if(kind==='red'){tone('square',330,t+.12,.16,.05);tone('square',262,t+.32,.24,.05);}
      else if(kind==='grey'){tone('triangle',392,t+.12,.35,.12);tone('triangle',523,t+.22,.3,.08);}
      else tone('sine',660,t+.05,.15,.08,null,880);}
  };
  return api;
})();
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>Snd.init(),{passive:true}));
let sfxOn=Snd.sfx;
function haptic(p){if(!sfxOn)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

/* =========================================================
   MAP DRAWING
   ========================================================= */
const C={grass:'#8CC63F',patch:'#84BE39',ink:'#2B2117',field1:'#93CC48',field2:'#86C13D',line:'#FFFFFF',sand:'#F3D27E',
  wood:'#A8703F',bamboo:'#E2C27A',bambooDk:'#B8964A',leaf:'#3E9E3A',leafHi:'#5CBF4A',orange:'#F28C28',
  red:'#D93A2F',blue:'#2F7FC1',teal:'#3A9BA8',skin:['#F1C59A','#D9A47A','#B9805A','#8E5D3F']};
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map'),shell=document.getElementById('shell');
function el(tag,a,p){const n=document.createElementNS(NS,tag);if(a)for(const k in a){if(k==='text')n.textContent=a[k];else n.setAttribute(k,a[k]);}if(p)p.appendChild(n);return n;}
function st(x){return Object.assign({stroke:C.ink,'stroke-width':3.5,'stroke-linejoin':'round','stroke-linecap':'round'},x||{});}
function lbl(p,x,y,t,size,extra){return el('text',Object.assign({x,y,'text-anchor':'middle','font-size':size||16,fill:C.ink,text:t},extra||{}),p);}
const halo={stroke:'#fff','stroke-width':4,'paint-order':'stroke'};
const vary=(i,base,spread)=>(base+((i*37)%17)/17*spread).toFixed(2);

const defs=el('defs',null,svg);
const T=el('g',{id:'tree'},defs);
el('ellipse',{cx:0,cy:4,rx:36,ry:9,fill:'rgba(0,0,0,.18)'},T);
el('path',Object.assign({d:'M-9 3 C-7 -14 -6 -30 -11 -46 L11 -46 C6 -30 7 -14 9 3 Z',fill:'#8B5A2B'},st({'stroke-width':3})),T);
[[-30,-64,26],[30,-64,26],[0,-86,32],[-15,-50,22],[16,-48,22]].forEach(([cx,cy,r])=>el('circle',Object.assign({cx,cy,r,fill:C.leaf},st({'stroke-width':3})),T));
[[-6,-95,13],[22,-72,9],[-28,-71,9]].forEach(([cx,cy,r])=>el('circle',{cx,cy,r,fill:C.leafHi},T));
const L={};
['ground','field','build','stands','people','trees','marks','hot','fx','dusk'].forEach(k=>L[k]=el('g',{id:'L-'+k},svg));

// ground
el('rect',{x:-1500,y:-1500,width:4400,height:3900,fill:C.grass},L.ground);
[[160,420,200,260],[1240,430,200,260],[700,830,420,90]].forEach(([cx,cy,rx,ry])=>el('ellipse',{cx,cy,rx,ry,fill:C.patch},L.ground));
const ROAD='M -200 870 C 200 840, 500 852, 700 856 S 1200 846, 1600 870';
el('path',{d:ROAD,fill:'none',stroke:'#D4AA52','stroke-width':62,'stroke-linecap':'round'},L.ground);
el('path',{d:ROAD,fill:'none',stroke:C.sand,'stroke-width':52,'stroke-linecap':'round'},L.ground);

// field
const F=L.field;
el('rect',{x:318,y:205,width:764,height:494,rx:10,fill:'#7DB838'},F);
for(let i=0;i<10;i++) el('rect',{x:330+i*74,y:215,width:74,height:470,fill:i%2?C.field2:C.field1},F);
const W={fill:'none',stroke:C.line,'stroke-width':4};
el('rect',Object.assign({x:330,y:215,width:740,height:470},W),F);
el('line',Object.assign({x1:700,y1:215,x2:700,y2:685},W),F);
el('circle',Object.assign({cx:700,cy:450,r:62},W),F);
el('circle',{cx:700,cy:450,r:5,fill:C.line},F);
el('rect',Object.assign({x:330,y:330,width:110,height:240},W),F);
el('rect',Object.assign({x:330,y:400,width:40,height:100},W),F);
el('rect',Object.assign({x:960,y:330,width:110,height:240},W),F);
el('rect',Object.assign({x:1030,y:400,width:40,height:100},W),F);
el('circle',{cx:408,cy:450,r:4.5,fill:C.line},F);el('circle',{cx:992,cy:450,r:4.5,fill:C.line},F);
[[302,410],[1070,410]].forEach(([x,y])=>{
  const g=el('g',null,F);
  el('rect',Object.assign({x,y,width:28,height:80,fill:'rgba(255,255,255,.55)'},st({'stroke-width':3})),g);
  for(let yy=y+10;yy<y+80;yy+=10) el('line',{x1:x,y1:yy,x2:x+28,y2:yy,stroke:C.ink,'stroke-width':1,opacity:.35},g);
  for(let xx=x+7;xx<x+28;xx+=7) el('line',{x1:xx,y1:y,x2:xx,y2:y+80,stroke:C.ink,'stroke-width':1,opacity:.35},g);
});
[[330,215],[1070,215],[330,685],[1070,685]].forEach(([x,y],i)=>{
  el('line',{x1:x,y1:y,x2:x,y2:y-26,stroke:C.ink,'stroke-width':3},F);
  el('path',Object.assign({class:'wave',style:`--d:${vary(i,.9,.6)}s;--dl:-${vary(i*3,0,1)}s`,d:`M${x} ${y-26} L${x+16} ${y-20} L${x} ${y-14} Z`,fill:C.orange},st({'stroke-width':2})),F);
});

// bunting
(function(){
  const g=el('g',null,L.build);
  const q=t=>{const a=[290,22],b=[700,58],c=[1110,22];const u=1-t;return[u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]];};
  el('path',{d:'M290 22 Q700 94 1110 22',fill:'none',stroke:C.ink,'stroke-width':2.5},g);
  for(let i=0;i<24;i++){const [x,y]=q((i+.5)/24);
    el('path',Object.assign({class:'flap',style:`--d:${vary(i,1.5,1.2)}s;--dl:-${vary(i*5,0,2)}s`,d:`M${x-11} ${y} L${x+11} ${y} L${x} ${y+22} Z`,fill:i%2?'#fff':C.red},st({'stroke-width':2})),g);}
})();

// houses
function house(x,y,w,wall,roof,i){
  const g=el('g',null,L.build),h=w*0.55,top=y-h;
  el('ellipse',{cx:x,cy:y+4,rx:w*0.62,ry:10,fill:'rgba(0,0,0,.16)'},g);
  el('rect',Object.assign({x:x-w/2,y:top,width:w,height:h,fill:wall},st()),g);

/* =========================================================
   CAMERA: geser, cubit (pinch), scroll, dan tombol zoom
   ========================================================= */
const toastEl=document.getElementById('toast');
const mobileMQ=window.matchMedia('(max-width:860px)');
const MOBW=720,BX=[-160,1560],BY=[-100,1000],MINW=300;
let cam={x:700,y:450,w:0},dragged=false,userZoomed=false,ptrActive=0;
const asp=()=>(svg.clientWidth||1)/(svg.clientHeight||1);
const fitW=()=>Math.max(1400,900*asp());
const defW=()=>mobileMQ.matches&&!shell.classList.contains('expanded')?MOBW:fitW();
function clampCam(c){
  const a=asp(),w=Math.max(MINW,Math.min(fitW(),c.w)),h=w/a;
  const vx=w>=BX[1]-BX[0]?700-w/2:Math.max(BX[0],Math.min(BX[1]-w,c.x-w/2));
  const vy=h>=BY[1]-BY[0]?450-h/2:Math.max(BY[0],Math.min(BY[1]-h,c.y-h/2));
  return {vx,vy,w,h};
}
const zIn=document.getElementById('zIn'),zOut=document.getElementById('zOut'),zFit=document.getElementById('zFit');
function applyCam(){
  const c=clampCam(cam);cam={x:c.vx+c.w/2,y:c.vy+c.h/2,w:c.w};
  svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  svg.setAttribute('viewBox',`${c.vx.toFixed(1)} ${c.vy.toFixed(1)} ${c.w.toFixed(1)} ${c.h.toFixed(1)}`);
  zIn.disabled=c.w<=MINW+1;zOut.disabled=c.w>=fitW()-1;
}
let camTween=0;
function camTo(to,ms){
  const from=Object.assign({},cam),tk=++camTween;
  tween(ms||650,p=>{if(tk!==camTween)return;const e=1-Math.pow(1-p,3);cam={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e};applyCam();});
}

(function(){
  const pts=new Map();let pan=null,pinch=null;
  const rel=e=>{const r=svg.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  function startPan(){const [k]=pts.keys(),p=pts.get(k);pan={sx:p[0],sy:p[1],c:Object.assign({},cam)};pinch=null;}
  svg.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,rel(e));ptrActive=pts.size;dragged=false;camTween++;
    if(pts.size===1)startPan();
    else if(pts.size===2){const [a,b]=[...pts.values()],mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      pinch={d0:Math.hypot(a[0]-b[0],a[1]-b[1])||1,w0:cam.w,mid,world:worldAt(mid[0],mid[1])};pan=null;}
  });
  window.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,rel(e));
    if(pinch&&pts.size>=2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1,mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const w=Math.max(MINW,Math.min(fitW(),pinch.w0*pinch.d0/d)),h=w/asp();
      cam={x:pinch.world[0]-mid[0]/svg.clientWidth*w+w/2,y:pinch.world[1]-mid[1]/svg.clientHeight*h+h/2,w};userZoomed=true;dragged=true;applyCam();return;}
    if(pan){const p=pts.get(e.pointerId),dx=p[0]-pan.sx,dy=p[1]-pan.sy;
      if(!dragged&&Math.hypot(dx,dy)<6)return;dragged=true;svg.classList.add('panning');
      const c=clampCam(pan.c);cam={x:pan.c.x-dx*c.w/svg.clientWidth,y:pan.c.y-dy*c.h/svg.clientHeight,w:pan.c.w};applyCam();}
  });
  function end(e){if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);ptrActive=pts.size;svg.classList.remove('panning');
    if(pts.size===1)startPan();if(pts.size===0){pan=null;pinch=null;setTimeout(()=>{dragged=false;},0);}}
  window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
})();

/* =========================================================
   LIVE MATCH: pertandingan berjalan selama tahap "Batas peluit"
   ========================================================= */
const FB={x0:352,x1:1048,y0:236,y1:664},GOAL={red:1070,blue:330};
const sim={on:false,raf:0,last:0,t:0,holder:null,receiver:null,timer:0,shot:false,lastKicker:null,kickT:-9,ball:{x:1022,y:436,vx:0,vy:0,rot:0}};
const clampF=(v,a,b)=>Math.max(a,Math.min(b,v));
function placeA(a){a.p.o.setAttribute('transform',`translate(${a.x.toFixed(1)} ${a.y.toFixed(1)})`);}
function placeBall(){const b=sim.ball;ball.setAttribute('transform',`translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) rotate(${(b.rot%360).toFixed(0)})`);}
function moveTo(a,tx,ty,spd,dt){
  const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);
  if(d>4){const k=Math.min(d,spd*dt)/d;a.x+=dx*k;a.y+=dy*k;}
  a.x=clampF(a.x,FB.x0-8,FB.x1+8);a.y=clampF(a.y,FB.y0,FB.y1+6);
  const mv=d>6;if(mv!==a.moving){a.moving=mv;a.p.o.classList.toggle('walk',mv);}
}
const teamOf=(team,ex)=>SIM.filter(a=>a.team===team&&a!==ex);
function nearest(list,x,y){let best=null,bd=1e9;list.forEach(a=>{const d=Math.hypot(a.x-x,a.y-y);if(d<bd){bd=d;best=a;}});return [best,bd];}
function give(a,hold){sim.holder=a;sim.receiver=null;sim.shot=false;sim.timer=hold;sim.ball.vx=0;sim.ball.vy=0;}
function kickTo(tx,ty,speed){const b=sim.ball,dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1;b.vx=dx/d*speed;b.vy=dy/d*speed;sim.lastKicker=sim.holder;sim.kickT=sim.t;sim.holder=null;}
function crowdPop(team){const s=stands[team==='red'?'merah':'biru'];if(s.tg.getAttribute('class')!=='trib')return;s.tg.setAttribute('class','trib excited');setTimeout(()=>{if(s.tg.getAttribute('class')==='trib excited')s.tg.setAttribute('class','trib');},2200);}
function decide(){
  const h=sim.holder,dir=h.team==='red'?1:-1,gx=GOAL[h.team];
  if(h.role!=='gk'&&Math.abs(gx-h.x)<210&&Math.random()<.55){
    const team=h.team;kickTo(gx+dir*12,450+(Math.random()*90-45),430);sim.shot=team;Snd.kick(1.3);Snd.gasp();crowdPop(team);return;}
  const mates=teamOf(h.team,h).filter(a=>a.role==='field');
  let pick=mates[0],best=-1e9;
  mates.forEach(a=>{const sc=(a.x-h.x)*dir+Math.random()*260-Math.hypot(a.x-h.x,a.y-h.y)*.25;if(sc>best){best=sc;pick=a;}});
  kickTo(pick.x+dir*18,pick.y,330);sim.receiver=pick;Snd.kick();
}
function simStep(now){
  if(!sim.on)return;
  const dt=Math.min(.05,(now-sim.last)/1000);sim.last=now;sim.t+=dt;
  const b=sim.ball;
  if(sim.holder){
    const h=sim.holder,dir=h.team==='red'?1:-1,px=b.x,py=b.y,k=Math.min(1,dt*12);
    b.x+=(h.x+dir*13-b.x)*k;b.y+=(h.y+3-b.y)*k;b.rot+=Math.hypot(b.x-px,b.y-py)*4;
    sim.timer-=dt;if(sim.timer<=0)decide();
  }else{
    const f=Math.pow(.4,dt);b.vx*=f;b.vy*=f;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=Math.hypot(b.vx,b.vy)*dt*4;
    if(b.y<FB.y0){b.y=FB.y0;b.vy=Math.abs(b.vy);}if(b.y>FB.y1){b.y=FB.y1;b.vy=-Math.abs(b.vy);}
    if(b.x>FB.x1-4||b.x<FB.x0+4){
      const def=b.x>700?'blue':'red',gk=SIM.find(a=>a.team===def&&a.role==='gk'),wasShot=sim.shot;
      b.x=clampF(b.x,FB.x0+4,FB.x1-4);give(gk,1.2);if(wasShot){crowdPop(def);Snd.cheer(.3);}
    }else{
      const [c,cd]=nearest(SIM.filter(a=>a.role!=='ref'&&!(a===sim.lastKicker&&sim.t-sim.kickT<.45)),b.x,b.y);
      if(c&&cd<15&&(Math.hypot(b.vx,b.vy)<280||c===sim.receiver))give(c,c.role==='gk'?1.2:.8+Math.random()*1.4);
    }
  }
  const hTeam=sim.holder?sim.holder.team:null,chasers=new Set();
  ['red','blue'].forEach(team=>{
    if(hTeam===team)return;
    const [c]=nearest(teamOf(team).filter(a=>a.role==='field'&&a!==sim.receiver),b.x,b.y);if(c)chasers.add(c);
  });
  SIM.forEach((a,i)=>{
    if(a.role==='ref'){moveTo(a,clampF(b.x-80,FB.x0+40,FB.x1-40),clampF(b.y+90,FB.y0+30,FB.y1),85,dt);refPos=[a.x,a.y];return;}
    if(a.role==='gk'){const gx=a.hx+(a.team==='red'?12:-12);moveTo(a,gx,a===sim.holder?450:clampF(b.y,405,495),a===sim.holder?40:90,dt);return;}
    if(a===sim.holder){const dir=a.team==='red'?1:-1;
      moveTo(a,clampF(GOAL[a.team]-dir*90,FB.x0,FB.x1),clampF(a.hy+(450-a.hy)*.4+Math.sin(sim.t*1.3+i)*40,FB.y0+20,FB.y1-20),78,dt);return;}
    if(a===sim.receiver){moveTo(a,b.x,b.y,125,dt);return;}
    if(chasers.has(a)){moveTo(a,b.x,b.y,100,dt);
      if(sim.holder&&Math.hypot(a.x-sim.holder.x,a.y-sim.holder.y)<16&&Math.random()<dt*.9){give(a,.8+Math.random());Snd.kick(.6);}return;}
    moveTo(a,clampF(a.hx+(b.x-700)*.38+Math.sin(sim.t*.7+i*1.7)*16,FB.x0+20,FB.x1-20),clampF(a.hy+(b.y-450)*.22+Math.cos(sim.t*.6+i)*12,FB.y0+10,FB.y1-10),62,dt);
  });
  SIM.forEach(placeA);placeBall();
  if(mobileMQ.matches&&!userZoomed&&!ptrActive&&sim.t>1.2){const k=Math.min(1,dt*1.5);cam.x+=(b.x-cam.x)*k;cam.y+=(b.y-cam.y)*k;applyCam();}
  sim.raf=requestAnimationFrame(simStep);
}
function simStart(){
  if(sim.on||reduce)return;
  const r=SIM.find(a=>a.role==='ref');r.x=refPos[0];r.y=refPos[1];
  sim.on=true;sim.t=0;sim.last=performance.now();sim.lastKicker=null;
  const [h]=nearest(teamOf('red').filter(a=>a.role==='field'),sim.ball.x,sim.ball.y);give(h,1.4);
  setTimeout(()=>{if(sim.on)Snd.whistle([.3]);},300);
  sim.raf=requestAnimationFrame(simStep);
}
function simStop(){sim.on=false;cancelAnimationFrame(sim.raf);SIM.forEach(a=>{a.moving=false;a.p.o.classList.remove('walk');});}
function simReset(){SIM.forEach(a=>{a.x=a.hx;a.y=a.hy;placeA(a);});sim.ball={x:1022,y:436,vx:0,vy:0,rot:0};sim.holder=null;sim.receiver=null;placeBall();}

  s+=ln([x,y],S,'#2B2117',16)+ln([x,y],S,shirt,12);

  {t:'Kontak di kotak penalti, dari posisimu nggak kelihatan jelas.',a:'grey',e:'Cek informasinya dulu, lalu putuskan dengan dasar yang jelas.'},
  {t:'Sebelum laga, ada yang menyelipkan amplop supaya kamu “bantu” salah satu tim.',a:'red',e:'Keputusan nggak boleh dikaitkan dengan imbalan.'},
  {t:'Kamu kasih kartu ke kapten RT 07 karena masih kesal soal ribut minggu lalu.',a:'red',e:'Wewenang dipakai untuk balas dendam. Dasarnya urusan pribadi, bukan kejadian di lapangan.'},
  {t:'Dua pemain saling dorong. Kamu harus memilih: kartu untuk satu orang, dua-duanya, atau cukup teguran.',a:'grey',e:'Perlu ditimbang. Yang penting dasarnya sama untuk dua-duanya.'},
  {t:'Bola baru dari panitia kamu bawa pulang buat anakmu.',a:'red',e:'Fasilitas dipakai untuk kepentingan pribadi.'},
  {t:'Kamu bilang ke hakim garis: “Kalau nggak nurut, tahun depan nggak usah jadi wasit lagi.”',a:'red',e:'Posisi dipakai untuk menekan orang.'}
];
const OPENS={o1:'Pak Harun, permintaan Bapak sudah saya dengar.',o2:'Terima kasih sudah menyampaikan langsung, Pak.'};
const OPEN_LBL={o1:'Permintaan sudah saya dengar',o2:'Terima kasih sudah menyampaikan'};
const TIMES={t1:'malam ini sebelum jam 20.00',t2:'besok pagi sebelum jam 09.00',t0:''};
const TIME_LBL={t1:'Malam ini, sebelum 20.00',t2:'Besok pagi, sebelum 09.00',t0:'Nggak usah sebut waktu'};
const STATUS='Soal membatalkan hasil pertandingan itu bukan wewenang wasit. Sudah saya teruskan ke panitia, ke Bu Ningsih.';
const STEPS=['Briefing','Insiden','Cek VAR','Umumkan','Batas peluit','Garis merah','Peluit panjang'];

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ico(id){return `<svg viewBox="-18 -18 36 36" width="22" height="22" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">${ICON[id]}</g></svg>`;}
function endDot(s){s=s.trim();return /[.!?]$/.test(s)?s:s+'.';}
const sleep=ms=>new Promise(r=>setTimeout(r,reduce?Math.min(ms,250):ms));

/* ---------- state ---------- */
function fresh(){return{stage:0,seen:new Set(),r1:null,r1why:'',r1Locked:false,
  frame:1,framesSeen:new Set([1]),r2:{choice:null,opt:null,why:'',locked:false},
  ann:{rekaman:true,reason:true,text:'',sent:false,reasonSaid:false},
  authIdx:0,authAns:[],wa:{open:'o1',time:'t1',text:'',sent:false,replied:false},chat:[],typing:false,
  sortIdx:0,sortAns:[],reflect:''};}
let state=fresh(),runToken=0;
const finalOpt=()=>state.r2.choice==='keep'?state.r1:state.r2.opt;
const reasonFinal=()=>state.r2.choice==='keep'?state.r1why:state.r2.why;

/* ---------- views ---------- */
function vBriefing(){
  const n=state.seen.size;
  const items=ORDER.map(id=>{const i=INFO[id];
    if(!state.seen.has(id))return `<div class="item locked"><span class="ico">${ico(id)}</span><div><strong>${i.title}</strong><p class="small">Belum dicek. Ketuk tandanya di peta.</p></div></div>`;
    return `<div class="item done"><span class="ico">${ico(id)}</span><div><strong>${i.title}</strong>${i.html}</div></div>`;}).join('');
  return `<p class="eyebrow">Final Turnamen 17-an antar RT</p>
  <h1>Peluit ada di tanganmu.</h1>
  <p>Sore ini kamu jadi wasit final RT 03 (merah) lawan RT 07 (biru). Sebelum pertandingan berlanjut, cek tiga hal di pinggir lapangan.</p>
  <div class="found">${items}</div>
  <div class="row"><span class="meter">${n} dari 3 dicek</span><button class="btn" data-act="toInsiden" ${n<3?'disabled':''}>Lanjutkan pertandingan</button></div>`;
}
function optList(name,exclude){
  return `<fieldset class="opts"><legend class="sr">Pilihan keputusan</legend>${Object.keys(OPT).filter(k=>!exclude.includes(k)).map(k=>`<label class="opt"><input type="radio" name="${name}" value="${k}" id="${name}-${k}"><span><b>${k}</b>${OPT[k].label}</span></label>`).join('')}</fieldset>`;
}
function impactHTML(k){const o=OPT[k];return `<div class="impact"><div class="merah"><h3>Tribun RT 03</h3><p>${o.m}</p></div><div class="biru"><h3>Tribun RT 07</h3><p>${o.b}</p></div></div>`;}
function vInsiden(){
  if(!state.r1Locked)return `<p class="eyebrow">Ronde 1 · Menit 78</p>
  <h2>Dimas jatuh di kotak penalti.</h2>
  <figure class="view">${myViewSVG()}<figcaption>Dari posisimu, badan Bayu menutupi kontaknya. Yang kelihatan cuma ini: Dimas jatuh, Bayu ada tepat di belakangnya.</figcaption></figure>
  <p>Dua tribun sudah berdiri. Kamu harus meniup peluit.</p>
  ${optList('r1',[])}
  <label class="field" for="why1">Karena...</label>
  <textarea id="why1" rows="3" placeholder="Satu-dua kalimat cukup."></textarea>
  <button class="btn" data-act="lock1" disabled>Tiup peluit</button>`;
  return `<p class="eyebrow">Ronde 1 · Keputusanmu</p>
  <h2>${OPT[state.r1].label}</h2>
  <p class="quote">“${esc(state.r1why)}”</p>
  ${impactHTML(state.r1)}
  <p class="callout">Lihat dua tribun di peta. Apa pun keputusanmu, separuh lapangan pasti kecewa.</p>
  <p>Petugas VAR melambaikan tangan dari tenda: <em>“Pak, ada rekaman dari sudut lain!”</em></p>
  <button class="btn" data-act="toVar">Ke tenda VAR</button>`;
}
function vVar(){
  const r2=state.r2,allSeen=state.framesSeen.size===4,fromD=state.r1==='D';
  if(r2.locked){
    const now=OPT[finalOpt()],ch=r2.choice;
    const msg=ch==='keep'?'Kamu mempertahankan keputusanmu. Bedanya, sekarang kamu memutuskan setelah melihat sudut lain.':
      ch==='change'?'Kamu menganulir keputusanmu sendiri setelah melihat rekaman, di depan dua tribun. Itu bukan tanda wasit yang lemah.':
      'Kamu menahan peluit sampai informasinya cukup, lalu memutuskan.';
    return `<p class="eyebrow">Hasil cek VAR</p>
    <h2>${ch==='keep'?'Keputusan tetap.':ch==='change'?'Keputusan dianulir.':'Peluit akhirnya ditiup.'}</h2>
    <div class="compare"><div><small>Tadi</small>${OPT[state.r1].label}</div><div class="arrow" aria-hidden="true">→</div><div><small>Sekarang</small>${now.label}</div></div>
    <p>${msg} Rekaman ini sengaja abu-abu: wasit lain bisa memutuskan berbeda, dan tetap masuk akal.</p>
    <p class="quote big">Yang bikin wasit kehilangan wibawa bukan mengubah keputusan. Tapi menolak melihat monitor.</p>
    <p class="small">Buat wasit, keputusan itu cuma satu tiupan peluit. Buat yang kena, bisa berarti pulang dengan kecewa.</p>
    <button class="btn" data-act="toUmum">Umumkan keputusan</button>`;
  }
  let decide='';
  if(fromD){
    decide=`<h2>Setelah lihat rekaman, apa keputusanmu?</h2>${optList('r2',['D'])}
    <label class="field" for="why2">Karena...</label><textarea id="why2" rows="3" placeholder="Apa yang kamu lihat di rekaman?"></textarea>
    <button class="btn" data-act="lock2" disabled>Tiup peluit</button>`;
  }else{
    decide=`<h2>Setelah lihat rekaman, keputusanmu masih sama?</h2>
    <div class="mon-btns"><button class="btn ${r2.choice==='keep'?'':'ghost'}" data-act="varKeep" aria-pressed="${r2.choice==='keep'}" ${allSeen?'':'disabled'}>Keputusan tetap</button><button class="btn ${r2.choice==='change'?'':'ghost'}" data-act="varChange" aria-pressed="${r2.choice==='change'}" ${allSeen?'':'disabled'}>Dianulir</button></div>
    ${r2.choice==='change'?`<h3>Keputusan barumu</h3>${optList('r2',[state.r1,'D'])}`:''}
    ${r2.choice?`<label class="field" for="why2">${r2.choice==='keep'?'Kenapa tetap?':'Kenapa dianulir?'}</label><textarea id="why2" rows="3" placeholder="Apa yang kamu lihat di rekaman?"></textarea><button class="btn" data-act="lock2" disabled>Kunci keputusan</button>`:''}`;
  }
  return `<p class="eyebrow">Ronde 2 · Cek VAR</p>
  <div class="monitor" role="group" aria-label="Layar rekaman VAR">
    <div class="mon-top"><span class="rec" aria-hidden="true"></span>SUDUT KAMERA HP WARGA<span class="tag">REPLAY</span></div>
    <div class="screen" id="screen">${FRAMES[state.frame-1].svg()}</div>
    <div class="scrub"><button class="btn small-btn ghost" data-act="fPrev" aria-label="Frame sebelumnya">‹</button><input type="range" id="frame" min="1" max="4" step="1" value="${state.frame}" aria-label="Geser rekaman"><button class="btn small-btn ghost" data-act="fNext" aria-label="Frame berikutnya">›</button></div>
    <p class="cap" id="cap">${state.frame}/4 · ${FRAMES[state.frame-1].cap}</p>
    <p class="seen" id="seen">${allSeen?'Semua frame sudah dilihat':`${state.framesSeen.size} dari 4 frame dilihat. Tonton semua dulu.`}</p>
  </div>
  <div class="decide" id="decide" ${allSeen||!fromD?'':'hidden'}>${decide}</div>`;
}
function composeAnn(){
  const a=state.ann,o=OPT[finalOpt()];
  return `Perhatian, bapak-ibu semua. ${a.rekaman?'Rekaman dari sudut lain sudah saya cek. ':''}Keputusan saya: ${o.stmt}.${a.reason&&reasonFinal()?' Alasannya: '+endDot(reasonFinal()):''}`;
}
function vUmum(){
  const a=state.ann,o=OPT[finalOpt()],lawan=o.fav==='merah'?'RT 07':'RT 03',kapten=o.fav==='merah'?'Rafi, kapten RT 07':'Gilang, kapten RT 03';
  if(!a.sent)return `<p class="eyebrow">Umumkan lewat toa</p>
  <h2>Dua tribun menunggu penjelasanmu.</h2>
  <div class="group"><span class="glabel">Isi pengumuman</span><div class="chips">
    <label class="chip"><input type="checkbox" id="annRek" ${a.rekaman?'checked':''}><span>Sebutkan rekaman sudah dicek</span></label>
    <label class="chip"><input type="checkbox" id="annRea" ${a.reason?'checked':''}><span>Sertakan alasanku</span></label></div></div>
  <label class="field" for="ann">Teks pengumuman (boleh diubah)</label>
  <textarea id="ann" rows="5">${esc(a.text||composeAnn())}</textarea>
  <button class="btn" data-act="announce">Umumkan lewat toa</button>`;
  return `<p class="eyebrow">Setelah pengumuman</p>
  <h2>Tribun ${lawan} tetap kecewa.</h2>
  <p class="quote">“${esc(a.text)}”</p>
  <div class="impact"><div class="${o.fav==='merah'?'biru':'merah'}"><h3>${kapten}</h3><p>${a.reasonSaid?'“Saya tetap nggak setuju, Pak. Tapi saya ngerti dasarnya.”':'“Alasannya apa, Pak?!”'}</p></div>
  <div class="${o.fav==='merah'?'merah':'biru'}"><h3>Tribun ${o.fav==='merah'?'RT 03':'RT 07'}</h3><p>Bersorak.</p></div></div>
  ${a.reasonSaid?'':'<p class="callout">Tanpa alasan, yang tersisa cuma kesan “wasitnya berat sebelah”.</p>'}
  <p class="quote big">Adil ≠ semua orang senang.</p>
  <p>Kamu nggak bisa bikin dua tribun sama-sama bahagia. Yang bisa kamu jaga: dasar keputusannya jelas, dan disampaikan.</p>
  <button class="btn" data-act="toBatas">Lanjut: menit 80 sampai bubar</button>`;
}
function chatHTML(){
  return `<div class="chat"><div class="chat-head"><span class="avatar">H</span><div><strong>Pak Harun (Ketua RT 07)</strong><small>${state.typing?'sedang mengetik…':'online'}</small></div></div>
  <div class="chat-body">${state.chat.map(m=>`<p class="bub${m.me?' me':''}${m.fresh?' new':''}">${esc(m.t)}</p>`).join('')}${state.typing?'<p class="bub typing new" aria-label="Pak Harun sedang mengetik"><i></i><i></i><i></i></p>':''}</div></div>`;
}
function composeWa(){const w=state.wa,t=TIMES[w.time];return OPENS[w.open]+' '+STATUS+(t?` Begitu ada jawaban dari panitia, saya kabari Bapak. Paling lambat ${t}.`:'');}
function vBatas(){
  const i=state.authIdx;
  if(i<AUTH.length){
    const it=AUTH[i],ans=state.authAns[i];
    return `<p class="eyebrow">Batas peluit · ${i+1} dari ${AUTH.length}</p>
    <h2>Ini wewenangmu, atau wewenang panitia?</h2>
    ${i===0?'<p class="small">Ingat buku aturan: wasit memimpin jalannya pertandingan; panitia memutuskan hasil akhir, banding, dan sanksi di luar pertandingan.</p>':''}
    <div class="sort-card"><small>${it.who}</small>${it.t}</div>
    ${ans==null?`<div class="sort-btns"><button class="btn" data-act="authPick" data-v="wasit">Wewenang saya: putuskan</button><button class="btn ghost" data-act="authPick" data-v="panitia">Wewenang panitia: naikkan</button></div>`:
    `<div class="feedback ${ans===it.a?'ok':'no'}"><strong>${ans===it.a?'Tepat.':'Coba lihat lagi buku aturannya.'}</strong> ${it.e}</div><button class="btn" data-act="authNext">${i<AUTH.length-1?'Permintaan berikutnya':'Lanjut'}</button>`}`;
  }
  const w=state.wa;
  if(!w.sent){
    const radio=(name,map,cur)=>Object.keys(map).map(k=>`<label class="chip"><input type="radio" name="${name}" value="${k}" id="${name}-${k}" ${cur===k?'checked':''}><span>${map[k]}</span></label>`).join('');
    return `<p class="eyebrow">Naikkan, tapi jangan menghilang</p>
    <h2>Pak Harun menunggu jawaban soal permintaannya.</h2>
    <p>Permintaannya sudah kamu teruskan ke panitia. Keputusannya belum ada. Kirim kabar ke Pak Harun.</p>
    <div class="group"><span class="glabel">Buka dengan</span><div class="chips" role="radiogroup">${radio('open',OPEN_LBL,w.open)}</div></div>
    <div class="group"><span class="glabel">Kapan kabar berikutnya?</span><div class="chips" role="radiogroup">${radio('time',TIME_LBL,w.time)}</div></div>
    <label class="field" for="wa">Pesanmu (boleh diubah)</label>
    <textarea id="wa" rows="5">${esc(w.text||composeWa())}</textarea>
    <p class="callout" id="nudge" ${w.time==='t0'?'':'hidden'}>Tanpa waktu, Pak Harun bakal menunggu tanpa tahu kapan dikabari. Belum ada jawaban ≠ boleh menghilang.</p>
    <button class="btn" data-act="sendWa">Kirim ke Pak Harun</button>`;
  }
  const hasTime=w.time!=='t0';
  return `<p class="eyebrow">Pesan terkirim</p>
  <h2>Kabar sudah sampai.</h2>
  ${chatHTML()}
  ${w.replied?`${hasTime?'':'<p class="callout">Pak Harun masih menunggu tanpa tahu kapan. Belum ada jawaban ≠ boleh menghilang.</p>'}
  <div class="flow">
    <div><span>Bisa diputuskan</span><span aria-hidden="true">→</span><span>Putuskan</span></div>
    <div><span>Bukan wewenang kita</span><span aria-hidden="true">→</span><span>Naikkan</span></div>
    <div><span>Belum final</span><span aria-hidden="true">→</span><span>Kasih kabar</span></div>
  </div>
  <button class="btn" data-act="toGaris">Lanjut: Garis merah</button>`:''}`;
}
function vGaris(){
  const i=state.sortIdx;
  if(i>=SORT.length){
    const right=SORT.filter((it,j)=>state.sortAns[j]===it.a).length;
    return `<p class="eyebrow">Garis merah</p>
    <h2>Punya peluit ≠ bebas meniupnya.</h2>
    <p>Kamu memilah ${right} dari ${SORT.length} situasi dengan tepat. Jangan pernah pakai wewenang untuk:</p>
    <ul class="checks">
      <li><span class="tick no" aria-hidden="true">✕</span><span>Kepentingan pribadi</span></li>
      <li><span class="tick no" aria-hidden="true">✕</span><span>Menghukum, membalas, atau menekan orang</span></li>
      <li><span class="tick no" aria-hidden="true">✕</span><span>Keputusan subjektif yang nggak bisa dipertanggungjawabkan</span></li>
      <li><span class="tick no" aria-hidden="true">✕</span><span>Meminta atau menerima imbalan terkait keputusan</span></li>
    </ul>
    <p class="quote big">Itu batas tegas yang nggak boleh kita langgar.</p>
    <button class="btn" data-act="toEnd">Peluit panjang</button>`;
  }
  const it=SORT[i],ans=state.sortAns[i];
  const fb=ans==null?'':(ans===it.a?(it.a==='red'?'Betul, ini garis merah.':'Betul, ini masih perlu ditimbang.'):(it.a==='red'?'Ini bukan wilayah abu-abu.':'Ini masih wilayah yang perlu ditimbang.'));
  return `<p class="eyebrow">Garis merah · ${i+1} dari ${SORT.length}</p>
  <h2>Abu-abu atau garis merah?</h2>
  ${i===0?'<p class="small">Ada situasi yang memang perlu ditimbang. Ada juga yang nggak perlu dibuat abu-abu.</p>':''}
  <div class="sort-card">${it.t}</div>
  ${ans==null?`<div class="sort-btns"><button class="btn ghost" data-act="sortPick" data-v="grey">Abu-abu, perlu ditimbang</button><button class="btn red" data-act="sortPick" data-v="red">Garis merah</button></div>`:
  `<div class="feedback ${ans===it.a?'ok':'no'}"><strong>${fb}</strong> ${it.e}</div><button class="btn" data-act="sortNext">${i<SORT.length-1?'Situasi berikutnya':'Selesai memilah'}</button>`}`;
}
function vEnd(){
  return `<p class="eyebrow">Peluit panjang</p>
  <h2>Wasit pulang setelah pertandingan. Kamu nggak.</h2>
  <p>Besok pagi kamu masih kerja bareng orang-orang yang kena keputusanmu hari ini. Karena itu leader nggak cukup cuma memutuskan dengan benar seperti wasit. Kita juga perlu ngobrol, menjelaskan, dan kasih kabar.</p>
  <h3>Bawa pulang ke tim</h3>
  <div class="map-table">
    <div><span>Peluit</span><span aria-hidden="true">→</span><span>Jabatan dan wewenangmu</span></div>
    <div><span>Rekaman VAR</span><span aria-hidden="true">→</span><span>Informasi baru tentang orang yang kena dampak</span></div>
    <div><span>Buku aturan</span><span aria-hidden="true">→</span><span>Batas kewenanganmu</span></div>
    <div><span>Toa pengumuman</span><span aria-hidden="true">→</span><span>Alasan dan kabar yang jelas ke tim</span></div>
  </div>
  <label class="field" for="reflect">Satu keputusan di timmu minggu ini yang perlu kamu “cek VAR” dulu:</label>
  <textarea id="reflect" rows="3" placeholder="Misalnya: pembagian jadwal minggu depan">${esc(state.reflect)}</textarea>
  <dl class="summary">
    <div><dt>Keputusan awal</dt><dd>${OPT[state.r1].label}</dd></div>
    <div><dt>Setelah VAR</dt><dd>${state.r2.choice==='keep'?'Tetap':OPT[finalOpt()].label}</dd></div>
    <div><dt>Wewenang</dt><dd>${state.authAns.filter((a,j)=>a===AUTH[j].a).length} dari ${AUTH.length} permintaan dipilah tepat</dd></div>
    <div><dt>Garis merah</dt><dd>${state.sortAns.filter((a,j)=>a===SORT[j].a).length} dari ${SORT.length} situasi dipilah tepat</dd></div>
  </dl>
  <div class="btns"><button class="btn" data-act="replay">Main lagi</button></div>
  <div class="next"><small>Berikutnya · V18</small><strong>Ketika kabar buruk sampai kepada kita</strong><span>Bukan waktu orang datang minta keputusan. Tapi waktu mereka datang bawa kabar buruk yang sebenarnya nggak pengen kita dengar.</span></div>`;
}
const VIEWS=[vBriefing,vInsiden,vVar,vUmum,vBatas,vGaris,vEnd];

/* =========================================================
   RENDER & FLOW
   ========================================================= */
const stepsEl=document.getElementById('steps'),cardEl=document.getElementById('card'),panelEl=document.getElementById('panel');
function render(newStage){
  stepsEl.innerHTML=STEPS.map((s,i)=>`<li class="${i<state.stage?'done':i===state.stage?'now':''}"${i===state.stage?' aria-current="step"':''}>${s}</li>`).join('');
  cardEl.innerHTML=VIEWS[state.stage]();
  state.chat.forEach(m=>m.fresh=false);
  if(newStage){
    panelEl.scrollTop=0;
    if(mobileMQ.matches&&window.scrollY>0)window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    const h=cardEl.querySelector('h1,h2');if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true});}catch(e){}}
  }
}
function buzzCard(){cardEl.classList.remove('buzz');void cardEl.offsetWidth;cardEl.classList.add('buzz');}
function go(s){state.stage=s;onEnter(s);render(true);}
function onEnter(s){
  L.hot.setAttribute('visibility',s===0?'visible':'hidden');
  if(s===0){Snd.setMood('normal');focusMap(700,600);}
  if(s===1){fallDimas(true);Snd.thud();Snd.gasp();haptic([40]);
    bubble('merah','Penalti!','wait','excited');setTimeout(()=>bubble('biru','Pura-pura!','wait','angry'),220);
    focusMap(960,430);toast('Menit 78: Dimas jatuh di kotak penalti');}
  if(s===2){Snd.setMood('tense');walkRef([842,716]);tvScreen.classList.add('glow');crowd(null);focusMap(900,640);}
  if(s===3){Snd.setMood('normal');tvScreen.classList.remove('glow');walkRef(REF0);fallDimas(false);focusMap(420,690);}
  if(s===4){scoreText.min.textContent='MENIT 80+';bubble('merah','');bubble('biru','');focusMap(700,450);setTimeout(()=>{if(state.stage===4)simStart();},900);toast('Pertandingan dilanjutkan');}
  if(s===5){simStop();show(panRing,false);scoreText.min.textContent='SELESAI';setEmpty(true);fallDimas(false);setTimeout(()=>zone('ask'),700);userZoomed=false;focusMap(700,450,mobileMQ.matches?760:fitW());}
  if(s===6){zone(null);setEmpty(true);Snd.whistle([.35,.35,1.1]);Snd.setMood('calm');dusk.setAttribute('opacity','.2');focusMap(700,450);notifyLMS();}
}
function onHot(id){
  if(state.stage!==0||dragged)return;
  Snd.pop();haptic(12);
  if(!state.seen.has(id)){state.seen.add(id);hotEls[id].classList.add('seen');toast(INFO[id].title+' sudah dicek');}
  render();
}
function setFrame(n){
  n=Math.max(1,Math.min(4,n));if(n!==state.frame)Snd.tick();state.frame=n;state.framesSeen.add(n);
  const scr=cardEl.querySelector('#screen');if(!scr)return;
  scr.innerHTML=FRAMES[n-1].svg();
  cardEl.querySelector('#cap').textContent=`${n}/4 · ${FRAMES[n-1].cap}`;
  cardEl.querySelector('#frame').value=n;
  const all=state.framesSeen.size===4;
  cardEl.querySelector('#seen').textContent=all?'Semua frame sudah dilihat':`${state.framesSeen.size} dari 4 frame dilihat. Tonton semua dulu.`;
  if(all){cardEl.querySelector('#decide').hidden=false;cardEl.querySelectorAll('[data-act=varKeep],[data-act=varChange]').forEach(b=>b.disabled=false);lockCheck();}
}
function lockCheck(){
  const need=state.r1==='D'||state.r2.choice==='change';
  const o=cardEl.querySelector('input[name=r2]:checked'),w=(cardEl.querySelector('#why2')||{}).value||'',b=cardEl.querySelector('[data-act=lock2]');
  if(b)b.disabled=!((!need||o)&&w.trim().length>=6&&state.framesSeen.size===4);
}

cardEl.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(!['fPrev','fNext'].includes(a))Snd.click();
  if(a==='toInsiden')go(1);
  else if(a==='lock1'){
    state.r1=cardEl.querySelector('input[name=r1]:checked').value;state.r1why=cardEl.querySelector('#why1').value.trim();state.r1Locked=true;
    Snd.whistle([.5]);haptic([50]);focusMap(700,125);
    setTimeout(()=>crowd(OPT[state.r1].fav),550);
    render(true);
  }
  else if(a==='toVar')go(2);
  else if(a==='fPrev')setFrame(state.frame-1);
  else if(a==='fNext')setFrame(state.frame+1);
  else if(a==='varKeep'||a==='varChange'){state.r2.choice=a==='varKeep'?'keep':'change';render();const t=cardEl.querySelector(a==='varKeep'?'#why2':'input[name=r2]');if(t)t.focus();}
  else if(a==='lock2'){
    const r=state.r2;if(state.r1==='D')r.choice='final';
    if(r.choice!=='keep')r.opt=cardEl.querySelector('input[name=r2]:checked').value;
    r.why=cardEl.querySelector('#why2').value.trim();r.locked=true;Snd.whistle([.45]);haptic([50]);render(true);
  }
  else if(a==='toUmum')go(3);
  else if(a==='announce'){
    const v=cardEl.querySelector('#ann').value.trim();if(!v)return;
    const A=state.ann;A.text=v;A.sent=true;A.reasonSaid=/alasan|karena/i.test(v);
    Snd.toa();show(toaWaves,true);setTimeout(()=>show(toaWaves,false),3200);
    setTimeout(()=>{focusMap(700,125);crowd(OPT[finalOpt()].fav);},1100);
    render(true);
  }
  else if(a==='toBatas')go(4);
  else if(a==='authPick'){
    const okAns=b.dataset.v===AUTH[state.authIdx].a;state.authAns[state.authIdx]=b.dataset.v;
    if(okAns){Snd.chime();haptic(20);}else{Snd.buzz();haptic([60,40,60]);}
    if(AUTH[state.authIdx].a==='panitia')show(panRing,true);
    render();if(!okAns)buzzCard();const n=cardEl.querySelector('[data-act=authNext]');if(n)n.focus();
  }
  else if(a==='authNext'){state.authIdx++;show(panRing,state.authIdx>=AUTH.length);render(true);}
  else if(a==='sendWa'){
    const v=cardEl.querySelector('#wa').value.trim();if(!v)return;
    state.wa.text=v;state.wa.sent=true;state.chat=[{t:'Pak Wasit, hasil hari ini harus dibatalkan. Laganya diulang minggu depan!'},{me:true,t:v,fresh:true}];Snd.send();render(true);
    (async()=>{const tk=runToken;await sleep(800);if(tk!==runToken)return;state.typing=true;render();await sleep(1300);if(tk!==runToken)return;state.typing=false;
      state.chat.push({t:state.wa.time==='t0'?'Terus kapan kabarnya, Pak?':'Baik. Saya tunggu kabarnya, Pak.',fresh:true});state.wa.replied=true;Snd.ding();haptic([20,60,20]);render();})();
  }
  else if(a==='toGaris')go(5);
  else if(a==='sortPick'){
    const it=SORT[state.sortIdx],okAns=b.dataset.v===it.a;state.sortAns[state.sortIdx]=b.dataset.v;
    if(okAns){Snd.chime();haptic(20);}else{Snd.buzz();haptic([60,40,60]);}
    zone(it.a);
    render();if(!okAns)buzzCard();const n=cardEl.querySelector('[data-act=sortNext]');if(n)n.focus();
  }
  else if(a==='sortNext'){state.sortIdx++;zone(state.sortIdx<SORT.length?'ask':'red');render(true);}
  else if(a==='toEnd')go(6);
  else if(a==='replay')resetAll();
});
function onField(e){
  const t=e.target;
  if(t.name==='r1'||t.id==='why1'){if(t.name==='r1')Snd.tick();const o=cardEl.querySelector('input[name=r1]:checked'),w=cardEl.querySelector('#why1').value;cardEl.querySelector('[data-act=lock1]').disabled=!(o&&w.trim().length>=6);}
  if(t.id==='frame'&&e.type==='input')setFrame(+t.value);
  if(t.name==='r2'||t.id==='why2')lockCheck();
  if(t.id==='annRek'||t.id==='annRea'){if(t.id==='annRek')state.ann.rekaman=t.checked;else state.ann.reason=t.checked;cardEl.querySelector('#ann').value=composeAnn();}
  if(t.name==='open'||t.name==='time'){if(e.type==='change')Snd.tick();if(t.name==='open')state.wa.open=t.value;else state.wa.time=t.value;cardEl.querySelector('#wa').value=composeWa();cardEl.querySelector('#nudge').hidden=state.wa.time!=='t0';}
  if(t.id==='reflect')state.reflect=t.value;
}
cardEl.addEventListener('input',onField);
cardEl.addEventListener('change',onField);

/* ---------- controls ---------- */
const btnMusic=document.getElementById('btnMusic'),btnSfx=document.getElementById('btnSfx'),btnExpand=document.getElementById('btnExpand');
btnMusic.setAttribute('aria-pressed',String(Snd.music));btnSfx.setAttribute('aria-pressed',String(Snd.sfx));
btnMusic.addEventListener('click',()=>{Snd.init();const v=!Snd.music;Snd.setMusic(v);btnMusic.setAttribute('aria-pressed',String(v));toast(v?'Musik menyala':'Musik mati');});
btnSfx.addEventListener('click',()=>{Snd.init();const v=!Snd.sfx;Snd.setSfx(v);sfxOn=v;btnSfx.setAttribute('aria-pressed',String(v));if(v){Snd.pop();haptic(20);}toast(v?'Efek suara & getar menyala':'Efek suara & getar mati');});
btnExpand.addEventListener('click',()=>{const v=!shell.classList.contains('expanded');shell.classList.toggle('expanded',v);btnExpand.setAttribute('aria-pressed',String(v));btnExpand.setAttribute('aria-label',v?'Perkecil peta':'Perbesar peta');
  setTimeout(()=>{if(!userZoomed)cam.w=defW();applyCam();},380);});

function resetAll(){
  runToken++;simStop();simReset();state=fresh();
  Object.values(hotEls).forEach(h=>h.classList.remove('seen'));
  fallDimas(false);bubble('merah','');bubble('biru','');
  refPos=REF0.slice();ref.o.setAttribute('transform',`translate(${REF0[0]} ${REF0[1]})`);
  tvScreen.classList.remove('glow');[redO,panRing,toaWaves].forEach(g=>show(g,false));zone(null);setEmpty(false);
  scoreText.min.textContent='MENIT 78';dusk.setAttribute('opacity','0');
  go(0);
}
cam.w=defW();applyCam();
go(0);
setTimeout(()=>{if(state.stage===0&&!userZoomed)toast(mobileMQ.matches?'Geser atau cubit peta untuk zoom':'Geser, scroll, atau klik dua kali untuk zoom');},2400);
})();
</script>
</body></html>
